const SHOP_HOME = {ably:"https://m.a-bly.com/",zigzag:"https://zigzag.kr/",musinsa:"https://www.musinsa.com/","29cm":"https://www.29cm.co.kr/",wconcept:"https://www.wconcept.co.kr/",etc:"https://www.google.com/"};
const examples = EX.map(([date,note,c],i) => ({
  id:"ex"+i, example:true, src:flatlay(c), w:600, h:800, date, note,
  tags: EX_ITEMS[i].map(([brand,name,shop],j) => ({id:"t"+j, x:SPOTS[j][0], y:SPOTS[j][1], brand, name, shop, url:SHOP_HOME[shop]}))
}));

/* ---------- State ---------- */
let canEdit = false, loaded = false;
let real = [];
let looks = examples;
let tab = "looks";
const V = { open:false, i:0, editing:false };

const pub = p => sb.storage.from(BUCKET).getPublicUrl(p).data.publicUrl;
const srcOf = l => l.example ? l.src : pub(l.photo);
const thumbOf = l => l.example ? l.src : pub(l.thumb);
const fromRow = r => ({ id:r.id, photo:r.photo, thumb:r.thumb, w:r.w, h:r.h, bytes:r.bytes||0, date:r.date, note:r.note||"", tags:r.tags||[], createdAt:Date.parse(r.created_at)||0 });
const usingExamples = () => real.length === 0;

function sortLooks(arr){ return arr.slice().sort((a,b) => (b.date||"").localeCompare(a.date||"") || (b.createdAt||0)-(a.createdAt||0)); }

/* ---------- Grid & items ---------- */
function render(){
  looks = usingExamples() ? (loaded ? examples : []) : sortLooks(real);
  const nTags = looks.reduce((n,l) => n + (l.tags||[]).length, 0);
  $("sub").textContent = loaded ? `코디 ${looks.length}개 · 태그된 아이템 ${nTags}개` + (usingExamples() ? " (예시)" : "") : "불러오는 중…";
  const used = real.reduce((n,l) => n + (l.bytes||0), 0), pct = used / QUOTA * 100;
  $("usage").innerHTML = canEdit ? `저장 공간 ${(used/1048576).toFixed(0)}MB / 1GB (${pct.toFixed(1)}%)<span class="meter ${pct >= 80 ? "warn" : ""}"><i style="width:${Math.min(100,pct).toFixed(1)}%"></i></span>${pct >= 80 ? " · 곧 가득 차요. 오래된 코디를 정리해 주세요." : ""}` : "";
  $("adminBtn").textContent = canEdit ? "로그아웃" : "관리자 로그인";
  $("addBtn").hidden = !canEdit;
  $("banner").innerHTML = usingExamples() && loaded
    ? `<div class="banner"><span><b>예시 코디</b>를 보여주고 있어요. ${canEdit ? "사진을 추가하면 예시는 사라지고 내 코디만 남아요." : "곧 코디가 올라올 예정이에요."}</span>${canEdit ? '<button class="add" id="bannerAdd">첫 코디 올리기</button>' : ""}</div>` : "";
  const ba = $("bannerAdd"); if (ba) ba.onclick = () => $("fileInput").click();
  $("main").innerHTML = tab === "looks" ? gridHTML() : itemsHTML();
}

function gridHTML(){
  if (!looks.length) return loaded ? `<div class="empty">아직 코디가 없어요</div>` : "";
  const groups = new Map();
  looks.forEach((l,i) => { const k = (l.date||"").slice(0,7); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(i); });
  let h = "";
  for (const [k, idxs] of groups){
    const [y,m] = k.split("-");
    h += `<section class="month"><h2>${y ? `${y}년 ${+m}월` : "날짜 없음"}<small>${idxs.length}</small></h2><div class="grid">`;
    for (const i of idxs){
      const l = looks[i], n = (l.tags||[]).length;
      h += `<button class="cell" data-i="${i}" aria-label="${esc(l.date)} ${esc(l.note)} 열기"><img src="${esc(thumbOf(l))}" alt="" loading="lazy">${n ? `<span class="badge">${TAG_ICON}${n}</span>` : ""}</button>`;
    }
    h += `</div></section>`;
  }
  return h;
}

function itemsHTML(){
  const map = new Map();
  looks.forEach((l,li) => (l.tags||[]).forEach(t => {
    const key = safeUrl(t.url) || (t.brand + "|" + t.name);
    if (!map.has(key)) map.set(key, {t, li, n:0});
    map.get(key).n++;
  }));
  if (!map.size) return `<div class="empty">태그된 아이템이 아직 없어요</div>`;
  let h = `<div class="items">`;
  for (const {t, li, n} of map.values()){
    const u = safeUrl(t.url);
    h += `<a class="item" ${u ? `href="${esc(u)}" target="_blank" rel="noopener noreferrer"` : ""}><img src="${esc(thumbOf(looks[li]))}" alt="" loading="lazy"><div style="min-width:0"><b>${esc(t.brand)}</b><span>${esc(t.name)}</span><em>코디 ${n}개에 사용</em></div><span class="shop">${esc(shopLabel(t.shop))}</span></a>`;
  }
  return h + `</div>`;
}

$("main").addEventListener("click", e => { const c = e.target.closest(".cell"); if (c) openViewer(+c.dataset.i); });
$("tabLooks").onclick = () => { tab = "looks"; $("tabLooks").setAttribute("aria-pressed","true"); $("tabItems").setAttribute("aria-pressed","false"); render(); };
$("tabItems").onclick = () => { tab = "items"; $("tabItems").setAttribute("aria-pressed","true"); $("tabLooks").setAttribute("aria-pressed","false"); render(); };

/* ---------- Viewer ---------- */
const viewer = $("viewer"), stage = $("stage"), track = $("track");

function openViewer(i, edit=false){
  V.open = true; V.i = i; V.editing = edit && canEdit && !looks[i]?.example;
  viewer.hidden = false; viewer.classList.add("show-tags");
  document.body.style.overflow = "hidden";
  renderViewer();
  try { if (!looks[i].example) history.replaceState(null, "", "#" + looks[i].id); } catch {}
}
function closeViewer(){ const was = V.editing; V.open = false; V.editing = false; viewer.hidden = true; document.body.style.overflow = ""; try { history.replaceState(null, "", location.pathname + location.search); } catch {} closeSheet(); }

function slideHTML(l){
  if (!l) return `<div class="slide"></div>`;
  const tags = (l.tags||[]).map(t => {
    const u = safeUrl(t.url);
    return `<div class="tag ${t.y > 58 ? "up" : "down"}" style="left:${t.x}%;top:${t.y}%" data-id="${esc(t.id)}"><span class="dot"></span><a class="bubble" ${u ? `href="${esc(u)}" target="_blank" rel="noopener noreferrer"` : 'role="button" tabindex="0"'} data-id="${esc(t.id)}"><span class="t"><b>${esc(t.brand || "브랜드")}</b><span>${esc(t.name || "")}</span></span><i>›</i></a></div>`;
  }).join("");
  return `<div class="slide"><div class="frame" data-w="${l.w||3}" data-h="${l.h||4}"><img src="${esc(srcOf(l))}" alt="${esc(l.note || "코디 사진")}">${tags}</div></div>`;
}

function renderViewer(){
  const l = looks[V.i];
  if (!l){ closeViewer(); return; }
  viewer.classList.toggle("editing", V.editing);
  if (V.editing) viewer.classList.add("show-tags");
  track.style.transition = "none"; track.style.transform = "translateX(-100%)";
  track.innerHTML = slideHTML(looks[V.i-1]) + slideHTML(l) + slideHTML(looks[V.i+1]);
  const d = new Date((l.date||"") + "T00:00:00");
  $("vDate").textContent = isNaN(d) ? "날짜 없음" : `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
  $("vNote").textContent = (l.example ? "예시 · " : "") + (l.note || "");
  $("vEdit").hidden = !(canEdit && !l.example);
  $("vEdit").textContent = V.editing ? "완료" : "편집";
  $("vHint").hidden = !V.editing;
  $("vCount").textContent = `${V.i+1} / ${looks.length}`;
  $("tagBtn").hidden = V.editing || !(l.tags||[]).length;
  const items = (l.tags||[]).map(t => {
    const u = safeUrl(t.url);
    return `<a class="chip" ${u && !V.editing ? `href="${esc(u)}" target="_blank" rel="noopener noreferrer"` : 'role="button" tabindex="0"'} data-id="${esc(t.id)}"><b>${esc(t.brand)} · ${esc(shopLabel(t.shop))}</b><span>${esc(t.name)}</span></a>`;
  }).join("");
  $("vItems").innerHTML = V.editing
    ? items + `<button class="chip add-chip" id="metaBtn">날짜·메모 / 삭제</button>`
    : (items || `<span class="v-empty">태그된 아이템이 없어요</span>`);
  const mb = $("metaBtn"); if (mb) mb.onclick = openMetaSheet;
  layout();
}

function layout(){
  const W = stage.clientWidth, H = stage.clientHeight;
  track.querySelectorAll(".frame").forEach(f => {
    const w = +f.dataset.w, h = +f.dataset.h, r = Math.min(W / w, H / h);
    f.style.width = Math.floor(w * r) + "px"; f.style.height = Math.floor(h * r) + "px";
  });
  track.querySelectorAll(".frame").forEach(f => {
    const fw = f.clientWidth;
    f.querySelectorAll(".tag").forEach(tag => {
      const b = tag.querySelector(".bubble"), px = parseFloat(tag.style.left) / 100 * fw, bw = b.offsetWidth;
      let left = px - bw / 2; left = Math.max(6, Math.min(left, fw - bw - 6));
      if (bw > fw - 12) left = 6;
      b.style.left = (left - px) + "px";
      b.style.setProperty("--ax", Math.max(12, Math.min(bw - 12, px - left)) + "px");
    });
  });
}
addEventListener("resize", () => { if (V.open) layout(); });

function go(dir){
  const ni = V.i + dir;
  if (ni < 0 || ni >= looks.length){ snap(); return; }
  track.style.transition = "transform .28s cubic-bezier(.2,.8,.2,1)";
  track.style.transform = `translateX(${dir > 0 ? -200 : 0}%)`;
  const done = () => { V.i = ni; renderViewer(); };
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) done();
  else track.addEventListener("transitionend", done, {once:true});
}
function snap(){ track.style.transition = "transform .22s"; track.style.transform = "translateX(-100%)"; stage.style.opacity = ""; }

let P = null;
stage.addEventListener("pointerdown", e => {
  if (e.button !== 0 || e.target.closest(".tag-btn")) return;
  P = { x:e.clientX, y:e.clientY, dx:0, dy:0, mode:null, target:e.target };
});
addEventListener("pointermove", e => {
  if (!P) return;
  P.dx = e.clientX - P.x; P.dy = e.clientY - P.y;
  if (!P.mode && Math.hypot(P.dx, P.dy) > 8) P.mode = Math.abs(P.dx) > Math.abs(P.dy) ? "h" : "v";
  if (P.mode === "h"){
    const edge = (P.dx > 0 && V.i === 0) || (P.dx < 0 && V.i === looks.length - 1);
    track.style.transition = "none";
    track.style.transform = `translateX(calc(-100% + ${edge ? P.dx / 3 : P.dx}px))`;
  } else if (P.mode === "v" && P.dy > 0 && !V.editing){
    track.style.transition = "none";
    track.style.transform = `translateX(-100%) translateY(${P.dy}px) scale(${Math.max(.8, 1 - P.dy / 1200)})`;
    viewer.style.background = `rgba(0,0,0,${Math.max(.3, 1 - P.dy / 400)})`;
  }
});
addEventListener("pointerup", e => {
  if (!P) return;
  const p = P; P = null; viewer.style.background = "";
  if (p.mode === "h"){
    const th = stage.clientWidth * .18;
    if (p.dx < -th) go(1); else if (p.dx > th) go(-1); else snap();
    return;
  }
  if (p.mode === "v"){ if (p.dy > 110 && !V.editing) closeViewer(); else snap(); return; }
  // tap
  if (p.target.closest(".bubble")) return; // link / edit handled by click
  const frame = p.target.closest(".frame");
  if (V.editing){
    const cur = track.children[1]?.querySelector(".frame");
    if (!cur) return;
    const r = cur.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) return;
    const x = +((e.clientX - r.left) / r.width * 100).toFixed(1), y = +((e.clientY - r.top) / r.height * 100).toFixed(1);
    openTagSheet(null, x, y);
    return;
  }
  viewer.classList.toggle("show-tags");
});
addEventListener("pointercancel", () => { if (P){ P = null; viewer.style.background = ""; snap(); } });

track.addEventListener("click", e => {
  const b = e.target.closest(".bubble");
  if (!b) return;
  if (V.editing){ e.preventDefault(); openTagSheet(b.dataset.id); return; }
  if (!b.getAttribute("href")){ e.preventDefault(); toast("판매 링크가 아직 없어요"); }
});
$("vItems").addEventListener("click", e => {
  const c = e.target.closest(".chip:not(.add-chip)");
  if (!c) return;
  if (V.editing){ e.preventDefault(); openTagSheet(c.dataset.id); return; }
  if (!c.getAttribute("href")){ e.preventDefault(); toast("판매 링크가 아직 없어요"); }
});
$("tagBtn").onclick = () => viewer.classList.toggle("show-tags");
$("vClose").onclick = closeViewer;
$("vEdit").onclick = () => { V.editing = !V.editing; renderViewer(); if (V.editing) toast("사진을 탭하면 태그가 추가돼요"); };
addEventListener("keydown", e => {
  if (!V.open || $("sheetHost").firstChild) { if (e.key === "Escape") closeSheet(); return; }
  if (e.key === "Escape") closeViewer();
  if (e.key === "ArrowRight") go(1);
  if (e.key === "ArrowLeft") go(-1);
});

/* ---------- Sheets ---------- */
function closeSheet(){ $("sheetHost").innerHTML = ""; }
function sheet(html){
  $("sheetHost").innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  $("scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeSheet(); });
}

function openTagSheet(tagId, x, y){
  const l = looks[V.i]; if (!l || l.example) return;
  const t = tagId ? (l.tags||[]).find(t => t.id === tagId) : { brand:"", name:"", shop:"ably", url:"" };
  if (!t) return;
  let shop = t.shop || "ably";
  sheet(`<h3>${tagId ? "아이템 수정" : "아이템 태그 추가"}</h3>
    <div class="field"><label for="fBrand">브랜드 / 쇼핑몰명</label><input id="fBrand" value="${esc(t.brand)}" placeholder="예: 모노레이어" autocomplete="off"></div>
    <div class="field"><label for="fName">제품명</label><input id="fName" value="${esc(t.name)}" placeholder="예: 울 라운드 니트" autocomplete="off"></div>
    <div class="field"><label>판매처</label><div class="shops" id="fShops">${SHOPS.map(([k,v]) => `<button type="button" data-k="${k}" aria-pressed="${k===shop}">${v}</button>`).join("")}</div></div>
    <div class="field"><label for="fUrl">판매 페이지 링크</label><input id="fUrl" type="url" inputmode="url" value="${esc(t.url)}" placeholder="https://m.a-bly.com/goods/…" autocomplete="off"></div>
    <div class="err" id="fErr"></div>
    <div class="row">${tagId ? '<button class="btn-d" id="fDel">태그 삭제</button>' : '<button class="btn-s" id="fCancel">취소</button>'}<button class="btn-p" id="fSave">저장</button></div>`);
  $("fShops").onclick = e => { const b = e.target.closest("button"); if (!b) return; shop = b.dataset.k; $("fShops").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); };
  if ($("fCancel")) $("fCancel").onclick = closeSheet;
  if ($("fDel")) $("fDel").onclick = async () => { await saveTags(l, (l.tags||[]).filter(x => x.id !== tagId)); closeSheet(); };
  $("fSave").onclick = async () => {
    const brand = $("fBrand").value.trim(), name = $("fName").value.trim(), raw = $("fUrl").value.trim();
    if (!brand && !name){ $("fErr").textContent = "브랜드나 제품명 중 하나는 입력해 주세요."; return; }
    const url = raw ? safeUrl(/^https?:\/\//i.test(raw) ? raw : "https://" + raw) : "";
    if (raw && !url){ $("fErr").textContent = "링크 형식을 확인해 주세요. https:// 로 시작하는 주소를 붙여넣어 주세요."; return; }
    const tags = (l.tags||[]).map(x => ({...x}));
    if (tagId){ Object.assign(tags.find(x => x.id === tagId), {brand, name, shop, url}); }
    else tags.push({ id: "t" + Date.now().toString(36), x, y, brand, name, shop, url });
    $("fSave").disabled = true;
    const ok = await saveTags(l, tags);
    if (ok) closeSheet(); else $("fSave").disabled = false;
  };
  setTimeout(() => $("fBrand")?.focus(), 250);
}

async function saveTags(l, tags){
  const { error } = await sb.from("looks").update({ tags }).eq("id", l.id);
  if (error){ toast("저장하지 못했어요. 로그인 상태를 확인해 주세요."); return false; }
  l.tags = tags; renderViewer(); return true;
}

function openMetaSheet(){
  const l = looks[V.i]; if (!l || l.example) return;
  sheet(`<h3>코디 정보</h3>
    <div class="field"><label for="mDate">날짜</label><input id="mDate" type="date" value="${esc(l.date)}"></div>
    <div class="field"><label for="mNote">메모</label><input id="mNote" value="${esc(l.note)}" placeholder="예: 가을 출근룩" maxlength="60"></div>
    <div class="row"><button class="btn-d" id="mDel">코디 삭제</button><button class="btn-p" id="mSave">저장</button></div>`);
  $("mSave").onclick = async () => {
    const date = $("mDate").value || l.date, note = $("mNote").value.trim();
    const { error } = await sb.from("looks").update({ date, note }).eq("id", l.id);
    if (error){ toast("저장하지 못했어요. 잠시 뒤 다시 시도해 주세요."); return; }
    l.date = date; l.note = note; closeSheet(); render(); const ni = looks.findIndex(x => x.id === l.id); if (ni >= 0){ V.i = ni; renderViewer(); }
  };
  let armed = false;
  $("mDel").onclick = async () => {
    if (!armed){ armed = true; $("mDel").textContent = "한 번 더 누르면 삭제"; return; }
    const { error } = await sb.from("looks").delete().eq("id", l.id);
    if (error){ toast("삭제하지 못했어요. 잠시 뒤 다시 시도해 주세요."); return; }
    sb.storage.from(BUCKET).remove([l.photo, l.thumb]).catch(() => {});
    real = real.filter(x => x.id !== l.id);
    closeSheet(); closeViewer(); render(); toast("코디를 삭제했어요");
  };
}

/* ---------- Upload ---------- */
$("addBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = async e => {
  const files = [...e.target.files]; e.target.value = "";
  if (!files.length || !canEdit) return;
  const added = [];
  for (const [n, f] of files.entries()){
    toast(`올리는 중 ${n + 1} / ${files.length}`, 0);
    try {
      const big = await shrink(f, 1280, .8), small = await shrink(f, 400, .72);
      const key = `${new Date().toISOString().slice(0,10)}/${Date.now().toString(36)}${n}`;
      const up1 = await sb.storage.from(BUCKET).upload(key + ".jpg", big.blob, { contentType:"image/jpeg", cacheControl:"31536000" });
      if (up1.error) throw up1.error;
      const up2 = await sb.storage.from(BUCKET).upload(key + "_t.jpg", small.blob, { contentType:"image/jpeg", cacheControl:"31536000" });
      if (up2.error) throw up2.error;
      const d = new Date(f.lastModified || Date.now());
      const date = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
      const { data, error } = await sb.from("looks").insert({ photo: key + ".jpg", thumb: key + "_t.jpg", w: big.w, h: big.h, bytes: big.blob.size + small.blob.size, date, note: "", tags: [] }).select().single();
      if (error) throw error;
      real.push(fromRow(data)); added.push(data.id);
    } catch (err) {
      toast(err && /maximum|quota|exceed/i.test(err.message || "") ? "저장 공간이 가득 찼어요. 오래된 코디를 지운 뒤 다시 올려 주세요." : "사진을 올리지 못했어요. 로그인 상태와 인터넷 연결을 확인해 주세요.", 4000);
      break;
    }
  }
  if (!added.length) return;
  render(); toast(`코디 ${added.length}개를 올렸어요`);
  if (added.length === 1){ const i = looks.findIndex(l => l.id === added[0]); if (i >= 0){ openViewer(i, true); toast("아이템 위치를 탭해서 태그를 달아 주세요", 3500); } }
};
function shrink(file, max, q){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * r), h = Math.round(img.naturalHeight * r);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res({ blob:b, w, h }) : rej(new Error("encode")), "image/jpeg", q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("이 사진 형식은 열 수 없어요. JPG나 PNG로 올려 주세요.")); };
    img.src = url;
  });
}

let toastT;
function toast(msg, ms=2200){
  $("toastHost").innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toastT); if (ms) toastT = setTimeout(() => $("toastHost").innerHTML = "", ms);
}

/* ---------- Admin login ---------- */
$("adminBtn").onclick = async () => {
  if (canEdit){ await sb.auth.signOut(); return; }
  sheet(`<h3>관리자 로그인</h3>
    <div class="field"><label for="lEmail">이메일</label><input id="lEmail" type="email" autocomplete="username" value="${esc(OWNER_EMAIL)}"></div>
    <div class="field"><label for="lPw">비밀번호</label><input id="lPw" type="password" autocomplete="current-password"></div>
    <div class="err" id="lErr"></div>
    <div class="row"><button class="btn-s" id="lCancel">취소</button><button class="btn-p" id="lGo">로그인</button></div>`);
  $("lCancel").onclick = closeSheet;
  const go = async () => {
    $("lGo").disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: $("lEmail").value.trim(), password: $("lPw").value });
    $("lGo").disabled = false;
    if (error){ $("lErr").textContent = "이메일이나 비밀번호가 맞지 않아요."; return; }
    closeSheet(); toast("로그인했어요. 코디 추가와 편집을 할 수 있어요.");
  };
  $("lGo").onclick = go;
  $("lPw").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  setTimeout(() => $("lPw")?.focus(), 250);
};
sb.auth.onAuthStateChange((_e, session) => {
  const was = canEdit;
  canEdit = !!session && (session.user?.email || "").toLowerCase() === OWNER_EMAIL;
  if (was !== canEdit){ if (!canEdit && V.editing){ V.editing = false; } render(); if (V.open) renderViewer(); }
});

/* ---------- Boot ---------- */
render();
(async () => {
  const rows = [];
  for (let from = 0; ; from += 1000){
    const { data, error } = await sb.from("looks").select("*").order("date", { ascending:false }).order("created_at", { ascending:false }).range(from, from + 999);
    if (error){ $("sub").textContent = "코디를 불러오지 못했어요. 새로고침해 주세요."; return; }
    rows.push(...data);
    if (data.length < 1000) break;
  }
  real = rows.map(fromRow); loaded = true; render();
  const id = decodeURIComponent(location.hash.slice(1));
  if (id){ const i = looks.findIndex(l => l.id === id); if (i >= 0) openViewer(i); }
})();
})();
</script>
